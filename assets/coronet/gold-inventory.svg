<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a8f4a"/><stop offset="1" stop-color="#3d4a22"/></linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a2b"/><stop offset="1" stop-color="#4a2e14"/></linearGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#c9921a"/></linearGradient>
  </defs>
  <!-- handle -->
  <path d="M22 14 Q22 5 32 5 Q42 5 42 14" fill="none" stroke="#4a2e14" stroke-width="3.5" stroke-linecap="round"/>
  <!-- bag body -->
  <path d="M14 20 Q14 12 22 12 H42 Q50 12 50 20 V52 Q50 58 44 58 H20 Q14 58 14 52 Z" fill="url(#leather)" stroke="#232b12" stroke-width="1.8"/>
  <!-- flap -->
  <path d="M14 22 Q14 14 22 14 H42 Q50 14 50 22 V30 Q32 40 14 30 Z" fill="url(#leather)" stroke="#232b12" stroke-width="1.8"/>
  <!-- front pocket -->
  <rect x="21" y="42" width="22" height="12" rx="3" fill="url(#strap)" stroke="#2a1a0a" stroke-width="1.4"/>
  <!-- buckle -->
  <rect x="28" y="31" width="8" height="8" rx="1.5" fill="url(#gold3)" stroke="#8a6410" stroke-width="1"/>
  <rect x="30.5" y="33.5" width="3" height="3" fill="#4a2e14"/>
  <!-- coin peeking from pocket -->
  <circle cx="32" cy="46" r="3" fill="url(#gold3)" stroke="#8a6410" stroke-width="0.8"/>
</svg>
